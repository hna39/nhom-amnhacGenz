    <script>
        (function () {
            let wasEnd = false;
            let exitCooldown = 0;

            function getOndoFrame() {
                return document.getElementById('ondoFrame');
            }

            const obs = new MutationObserver(() => {
                const isEnd = document.body.dataset.end === '1';
                if (isEnd !== wasEnd) {
                    wasEnd = isEnd;
                    const frame = getOndoFrame();
                    if (isEnd && frame && frame.contentWindow) {
                        frame.contentWindow.postMessage({ type: 'ONDO_ENTER' }, '*');
                        try { frame.contentWindow.focus(); } catch (e) {}
                    }
                }
            });
            obs.observe(document.body, { attributes: true, attributeFilter: ['data-end'] });

            window.addEventListener('wheel', (e) => {
                if (document.body.dataset.end !== '1') return;
                const frame = getOndoFrame();
                if (!frame || !frame.contentWindow) return;
                // Cuộn lên/xuống đều chuyển vào trang cuối, không tự quay về hồ sen 3D
                e.preventDefault();
                frame.contentWindow.postMessage({ type: 'ONDO_WHEEL_FORWARD', deltaY: e.deltaY }, '*');
            }, { passive: false });

            window.addEventListener('message', (e) => {
                if (!e.data || !e.data.type) return;
                // Chỉ quay về hồ sen 3D khi bấm nút, bỏ qua mọi lệnh thoát do cuộn
                if (e.data.type === 'ONDO_EXIT_TOP' && e.data.fromPill) {
                    const now = performance.now();
                    if (now < exitCooldown) return;
                    exitCooldown = now + 900;
                    document.body.dataset.end = '';
                    window.scrollBy({ top: -window.innerHeight * 0.85, behavior: 'smooth' });
                }
            });
        })();
    </script>
